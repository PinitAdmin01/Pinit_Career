version: '3.8'

services:
  voice-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinit_voice_microservice
    environment:
      - PORT=3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_SSD_CACHE=true
    ports:
      - "3005:3005"
    volumes:
      - ./audio_cache:/app/audio_cache
      - ./models:/app/models
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pinit_voice_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  nginx:
    image: nginx:alpine
    container_name: pinit_voice_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - voice-service
    restart: always

volumes:
  redis_data:
