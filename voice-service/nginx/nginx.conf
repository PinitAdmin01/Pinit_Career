worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_types audio/wav application/json text/plain;

    # Upstream Voice Microservice Cluster (Load Balanced)
    upstream kokoro_voice_backend {
        server voice-service:3005 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client Max Body Size for Text Payloads
        client_max_body_size 2M;

        # Main API Proxy
        location /api/v1/ {
            proxy_pass http://kokoro_voice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering & Streaming settings
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health Probes
        location /health {
            proxy_pass http://kokoro_voice_backend/api/v1/health/live;
        }

        # Prometheus Telemetry
        location /metrics {
            proxy_pass http://kokoro_voice_backend/api/v1/metrics;
        }
    }
}
