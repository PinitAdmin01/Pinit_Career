# Redis Configuration for PinIT Voice Cache Backend
# 
# Policy: LRU (Least Recently Used) eviction
# Never expire keys by age — only evict when storage limit is hit.
# Audio clips are permanent until storage pressure forces cleanup.

# ── Memory Limit ──────────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence: Disabled for pure cache use ──────────────────────────────────
# We don't need disk-based RDB snapshots — audio files are on disk already.
# Comment these in if you want Redis to survive restarts:
# save 900 1
# save 300 10
# save 60 10000
save ""

# ── Performance ───────────────────────────────────────────────────────────────
tcp-keepalive 60
hz 15

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice

# ── Bind ─────────────────────────────────────────────────────────────────────
# Bind to localhost only for security (change for multi-server setups)
bind 127.0.0.1

# ── Port ─────────────────────────────────────────────────────────────────────
port 6379

# ── Max connected clients ─────────────────────────────────────────────────────
maxclients 1000
