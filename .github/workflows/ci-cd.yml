name: PinIT AI Voice System CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Test & Lint Voice Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r voice-service/requirements.txt pytest httpx

      - name: Run Backend Unit & Integration Tests
        run: |
          python voice-service/test_tts.py
          python voice-service/test_middleware.py
          python voice-service/test_stream.py

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Run TypeScript Typecheck
        run: |
          npm ci
          npx tsc --noEmit

      - name: Build Docker Container
        run: |
          docker build -t pinit-voice-service:latest voice-service/
