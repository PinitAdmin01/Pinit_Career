name: PinIT AI Voice System CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build, Test & Lint Voice Microservice
    runs-on: ubuntu-latest

    env:
      # Prevent kokoro-onnx from downloading 300MB model weights on CI runners.
      # Edge-TTS fallback is used instead — this is safe and fast.
      KOKORO_REAL: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "voice-service/requirements.txt"

      - name: Install Python Dependencies
        working-directory: voice-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx nest-asyncio

      - name: Run TTS Engine Unit Tests
        working-directory: voice-service
        run: python -c "from test_tts import test_kokoro_service; test_kokoro_service()"

      - name: Run Security & Middleware Tests
        working-directory: voice-service
        run: python -c "from test_middleware import test_security_and_compression_middleware; test_security_and_compression_middleware()"

      - name: Run Real-Time Streaming Tests
        working-directory: voice-service
        run: python -c "from test_stream import test_realtime_audio_streaming; test_realtime_audio_streaming()"

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Docker Container
        run: docker build -t pinit-voice-service:latest voice-service/
