<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinIT Kokoro Voice Engine — Caching & TTS Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 { font-size: 1.75rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem; }

    textarea {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 0.75rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: var(--accent); }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 1rem;
    }

    select, button {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
    }

    button.btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }

    .stat-box .number { font-size: 1.75rem; font-weight: 700; color: #fff; }
    .stat-box .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-top: 0.25rem; }

    .chunk-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .chunk-item {
      background: #0f172a;
      border-left: 4px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 0 8px 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chunk-item.hit { border-left-color: var(--success); }
    .chunk-item.miss { border-left-color: var(--warning); }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge.hit { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge.miss { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

    code { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎙️ PinIT Kokoro Voice Engine</h1>
      <p class="subtitle">Isolated Sandbox — Testing 3-Tier Caching & Sentence-Level Chunking</p>
    </header>

    <!-- Controls -->
    <div class="card">
      <label for="textInput">Enter Paragraph / Text for Audio Generation</label>
      <textarea id="textInput">Welcome to today's lesson. Great job, Vinay! Let's begin our Python coding quest.</textarea>
      
      <div class="controls">
        <select id="voiceSelect">
          <option value="en-us-nicole">Nicole (English US - Female)</option>
          <option value="en-us-emma">Emma (English US - Female)</option>
          <option value="en-us-james">James (English US - Male)</option>
        </select>

        <button class="btn-primary" id="playBtn" onclick="runAudioPipeline()">
          <span>▶ Generate & Play</span>
        </button>
      </div>
    </div>

    <!-- Live Caching Metrics -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="number" id="hitsCount">0</div>
        <div class="label">Tier-1 Browser Hits (0ms)</div>
      </div>
      <div class="stat-box">
        <div class="number" id="missesCount">0</div>
        <div class="label">Server Generations</div>
      </div>
      <div class="stat-box">
        <div class="number" id="ratioCount">0%</div>
        <div class="label">Cache Efficiency</div>
      </div>
    </div>

    <!-- Sentence Chunk Breakdown -->
    <div class="card">
      <label>Sentence Chunk Decomposition</label>
      <div class="chunk-list" id="chunkContainer">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Click "Generate & Play" to visualize sentence chunking and cache keys.</p>
      </div>
    </div>
  </div>

  <script src="client_tts.js"></script>
  <script>
    async function runAudioPipeline() {
      const text = document.getElementById("textInput").value;
      const voice = document.getElementById("voiceSelect").value;
      const playBtn = document.getElementById("playBtn");
      const container = document.getElementById("chunkContainer");

      if (!text.trim()) return alert("Please enter text.");

      playBtn.disabled = true;
      playBtn.innerText = "⏳ Processing...";
      container.innerHTML = "";

      try {
        const res = await PinITVoice.playParagraph(text, voice, (evt) => {
          if (evt.type === "chunk_status") {
            const item = document.createElement("div");
            const isHit = evt.status === "CACHE_HIT";
            item.className = `chunk-item ${isHit ? 'hit' : 'miss'}`;
            item.innerHTML = `
              <div>
                <strong>Chunk ${evt.chunk + 1}:</strong> "${evt.sentence}"
              </div>
              <span class="badge ${isHit ? 'hit' : 'miss'}">${isHit ? 'TIER-1 CACHE HIT (0ms)' : 'GENERATING (Server)'}</span>
            `;
            container.appendChild(item);
          }
        });

        document.getElementById("hitsCount").innerText = res.hits;
        document.getElementById("missesCount").innerText = res.misses;
        const total = res.hits + res.misses;
        const ratio = total > 0 ? Math.round((res.hits / total) * 100) : 0;
        document.getElementById("ratioCount").innerText = `${ratio}%`;

      } catch (err) {
        alert("Error executing voice pipeline: " + err.message + "\nMake sure speech_server.py is running on port 8000!");
      } finally {
        playBtn.disabled = false;
        playBtn.innerText = "▶ Generate & Play";
      }
    }
  </script>
</body>
</html>
